<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>.paper{fill:#fff}.line{stroke:#111;stroke-width:1.7;fill:none}.dash{stroke:#111;stroke-width:1.4;stroke-dasharray:7 6;fill:none}.box{fill:#fff;stroke:#111;stroke-width:1.8}.act{fill:#f9fafb;stroke:#111;stroke-width:1.5}.text{font-family:"Times New Roman",serif;fill:#111}.title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.msg{font-size:15px}.arrow{marker-end:url(#m)}.return{marker-end:url(#m);stroke-dasharray:7 6}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs>
  <rect class="paper" width="1600" height="900"/><text class="text title" x="800" y="55" text-anchor="middle">Biểu đồ trình tự: Xem và sửa phụ đề</text>
  <rect class="box" x="80" y="100" width="170" height="52"/><text class="text label" x="165" y="132" text-anchor="middle">Người dùng</text>
  <rect class="box" x="360" y="100" width="190" height="52"/><text class="text label" x="455" y="132" text-anchor="middle">Frontend</text>
  <rect class="box" x="670" y="100" width="190" height="52"/><text class="text label" x="765" y="132" text-anchor="middle">Backend API</text>
  <rect class="box" x="980" y="100" width="190" height="52"/><text class="text label" x="1075" y="132" text-anchor="middle">File Storage</text>
  <rect class="box" x="1280" y="100" width="190" height="52"/><text class="text label" x="1375" y="132" text-anchor="middle">Database</text>
  <path class="dash" d="M165 152 V820"/><path class="dash" d="M455 152 V820"/><path class="dash" d="M765 152 V820"/><path class="dash" d="M1075 152 V820"/><path class="dash" d="M1375 152 V820"/>
  <rect class="act" x="447" y="220" width="16" height="500"/><rect class="act" x="757" y="280" width="16" height="390"/><rect class="act" x="1067" y="340" width="16" height="255"/><rect class="act" x="1367" y="430" width="16" height="190"/>
  <path class="line arrow" d="M165 225 H447"/><text class="text msg" x="306" y="215" text-anchor="middle">Mở kết quả phụ đề</text>
  <path class="line arrow" d="M463 295 H757"/><text class="text msg" x="610" y="285" text-anchor="middle">GET /api/status/{job_id}</text>
  <path class="line arrow" d="M773 355 H1067"/><text class="text msg" x="920" y="345" text-anchor="middle">Đọc JSON phụ đề</text>
  <path class="line return" d="M1067 405 H773"/><text class="text msg" x="920" y="395" text-anchor="middle">Trả subtitles</text>
  <path class="line return" d="M757 455 H463"/><text class="text msg" x="610" y="445" text-anchor="middle">Hiển thị danh sách phụ đề</text>
  <path class="line arrow" d="M165 515 H447"/><text class="text msg" x="306" y="505" text-anchor="middle">Chỉnh sửa nội dung</text>
  <path class="line arrow" d="M463 560 H757"/><text class="text msg" x="610" y="550" text-anchor="middle">PUT /api/subtitles/{job_id}</text>
  <path class="line arrow" d="M773 610 H1067"/><text class="text msg" x="920" y="600" text-anchor="middle">Ghi lại JSON và SRT</text>
  <path class="line arrow" d="M773 650 H1367"/><text class="text msg" x="1070" y="640" text-anchor="middle">Cập nhật subtitles, ghi history</text>
  <path class="line return" d="M757 710 H463"/><text class="text msg" x="610" y="700" text-anchor="middle">Trả status=saved</text>
  <path class="line return" d="M447 760 H165"/><text class="text msg" x="306" y="750" text-anchor="middle">Thông báo lưu thành công</text>
</svg>
