<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs><style>.bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#d7deea;stroke-width:2}.row{fill:#f8fafc;stroke:#dbe3ef;stroke-width:2}.btn{fill:#2563eb}.text{font-family:Arial,sans-serif;fill:#0f172a}.muted{fill:#64748b}.title{font-size:32px;font-weight:800}.label{font-size:18px;font-weight:700}.small{font-size:14px}</style></defs>
  <rect class="bg" width="1500" height="900" rx="28"/>
  <text class="text title" x="70" y="70">Editor phụ đề</text><text class="muted small" x="70" y="100">Chỉnh sửa nội dung tiếng Việt trước khi tải SRT hoặc xuất hardsub</text>
  <rect class="panel" x="70" y="140" width="1360" height="660" rx="24"/>
  <text class="muted label" x="110" y="195">#</text><text class="muted label" x="210" y="195">Thời gian</text><text class="muted label" x="520" y="195">Nội dung phụ đề</text><text class="muted label" x="1230" y="195">Trạng thái</text>
  <g transform="translate(100 230)">
    <rect class="row" width="1280" height="90" rx="14"/><text class="text label" x="20" y="55">1</text><text class="muted small" x="110" y="40">00:00:01,000</text><text class="muted small" x="110" y="65">00:00:04,000</text><text class="text label" x="420" y="55">Xin chào, hôm nay chúng ta sẽ tìm hiểu về trí tuệ nhân tạo.</text><text class="muted small" x="1140" y="55">Đã lưu</text>
    <rect class="row" y="115" width="1280" height="90" rx="14"/><text class="text label" x="20" y="170">2</text><text class="muted small" x="110" y="155">00:00:05,000</text><text class="muted small" x="110" y="180">00:00:09,000</text><text class="text label" x="420" y="170">Hệ thống tự động nhận diện giọng nói và dịch sang tiếng Việt.</text><text class="muted small" x="1140" y="170">Đã lưu</text>
    <rect class="row" y="230" width="1280" height="90" rx="14"/><text class="text label" x="20" y="285">3</text><text class="muted small" x="110" y="270">00:00:10,000</text><text class="muted small" x="110" y="295">00:00:14,000</text><text class="text label" x="420" y="285">Người dùng có thể chỉnh sửa từng dòng phụ đề trước khi xuất file.</text><text class="muted small" x="1140" y="285">Đã lưu</text>
  </g>
  <rect class="btn" x="930" y="725" width="190" height="54" rx="14"/><text fill="#fff" class="label" x="1025" y="760" text-anchor="middle">Lưu phụ đề</text>
  <rect class="panel" x="1140" y="725" width="190" height="54" rx="14"/><text class="text label" x="1235" y="760" text-anchor="middle">Tải SRT</text>
</svg>
