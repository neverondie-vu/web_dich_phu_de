<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
  <defs>
    <style>
      .paper{fill:#fff}
      .box{fill:#fff;stroke:#111;stroke-width:2.4}
      .sep{stroke:#111;stroke-width:1.6}
      .rel{stroke:#111;stroke-width:2.1;fill:none}
      .dash{stroke:#111;stroke-width:1.8;stroke-dasharray:9 7;fill:none}
      .text{font-family:"Times New Roman",serif;fill:#111}
      .title{font-size:28px;font-weight:700}
      .table{font-size:24px;font-weight:700}
      .field{font-size:19px}
      .key{font-size:19px;font-weight:700}
      .note{font-size:17px;font-style:italic}
      .multi{font-size:19px;font-weight:700}
      .label{font-size:18px}
    </style>
  </defs>

  <rect class="paper" width="1800" height="1150"/>
  <text class="text title" x="900" y="60" text-anchor="middle">SƠ ĐỒ ERD CƠ SỞ DỮ LIỆU HỆ THỐNG TẠO PHỤ ĐỀ</text>

  <!-- NguoiDung -->
  <g transform="translate(90 155)">
    <rect class="box" width="390" height="345"/>
    <line class="sep" x1="0" y1="60" x2="390" y2="60"/>
    <text class="text table" x="195" y="38" text-anchor="middle">NguoiDung</text>
    <text class="text key" x="24" y="96">PK maNguoiDung</text>
    <text class="text field" x="24" y="132">email</text>
    <text class="text field" x="24" y="168">tenDangNhap</text>
    <text class="text field" x="24" y="204">vaiTro</text>
    <text class="text field" x="24" y="240">goiDichVu</text>
    <text class="text field" x="24" y="276">maXacThucFirebase</text>
    <text class="text field" x="24" y="312">ngayTao, ngayCapNhat</text>
  </g>

  <!-- CongViecVideo -->
  <g transform="translate(705 125)">
    <rect class="box" width="440" height="410"/>
    <line class="sep" x1="0" y1="60" x2="440" y2="60"/>
    <text class="text table" x="220" y="38" text-anchor="middle">CongViecVideo</text>
    <text class="text key" x="24" y="96">PK maCongViec</text>
    <text class="text field" x="24" y="132">tenTep</text>
    <text class="text field" x="24" y="168">ngonNguNguon</text>
    <text class="text field" x="24" y="204">trangThai</text>
    <text class="text field" x="24" y="240">duongDanVideoGoc</text>
    <text class="text field" x="24" y="276">duongDanSRT</text>
    <text class="text field" x="24" y="312">duongDanVideoPhuDe</text>
    <text class="text field" x="24" y="348">viTriHienThiPhuDe</text>
    <text class="text field" x="24" y="384">ngayTao</text>
  </g>

  <!-- TepPhuongTien -->
  <g transform="translate(1325 155)">
    <rect class="box" width="390" height="345"/>
    <line class="sep" x1="0" y1="60" x2="390" y2="60"/>
    <text class="text table" x="195" y="38" text-anchor="middle">TepPhuongTien</text>
    <text class="text key" x="24" y="96">PK maTep</text>
    <text class="text key" x="24" y="132">FK maCongViec</text>
    <text class="text key" x="24" y="168">FK maNguoiDung</text>
    <text class="text field" x="24" y="204">tenTepGoc</text>
    <text class="text field" x="24" y="240">loaiTep</text>
    <text class="text field" x="24" y="276">ngonNguNguon</text>
    <text class="text field" x="24" y="312">duongDanTep, kieuMime</text>
  </g>

  <!-- PhuDe -->
  <g transform="translate(360 710)">
    <rect class="box" width="430" height="330"/>
    <line class="sep" x1="0" y1="60" x2="430" y2="60"/>
    <text class="text table" x="215" y="38" text-anchor="middle">PhuDe</text>
    <text class="text key" x="24" y="96">PK maPhuDe</text>
    <text class="text key" x="24" y="132">FK maCongViec</text>
    <text class="text key" x="24" y="168">FK maTep</text>
    <text class="text field" x="24" y="204">ngonNguDich</text>
    <text class="text field" x="24" y="240">duongDanJSON</text>
    <text class="text field" x="24" y="276">duongDanSRT, soDoanPhuDe</text>
  </g>

  <!-- LichSuXuLy -->
  <g transform="translate(1030 710)">
    <rect class="box" width="430" height="330"/>
    <line class="sep" x1="0" y1="60" x2="430" y2="60"/>
    <text class="text table" x="215" y="38" text-anchor="middle">LichSuXuLy</text>
    <text class="text key" x="24" y="96">PK maLichSu</text>
    <text class="text key" x="24" y="132">FK maCongViec</text>
    <text class="text key" x="24" y="168">FK maNguoiDung</text>
    <text class="text field" x="24" y="204">hanhDong</text>
    <text class="text field" x="24" y="240">trangThai</text>
    <text class="text field" x="24" y="276">thongBao, ngayTao</text>
  </g>

  <!-- relationships: NguoiDung to CongViecVideo -->
  <path class="rel" d="M480 315 H705"/>
  <text class="text multi" x="505" y="298">1</text>
  <text class="text multi" x="660" y="298">N</text>
  <text class="text label" x="592" y="348" text-anchor="middle">tạo công việc</text>

  <!-- CongViecVideo to TepPhuongTien -->
  <path class="rel" d="M1145 315 H1325"/>
  <text class="text multi" x="1168" y="298">1</text>
  <text class="text multi" x="1288" y="298">1</text>
  <text class="text label" x="1235" y="348" text-anchor="middle">có tệp nguồn</text>

  <!-- CongViecVideo to PhuDe -->
  <path class="rel" d="M870 535 V620 H575 V710"/>
  <text class="text multi" x="888" y="565">1</text>
  <text class="text multi" x="592" y="692">0..1</text>
  <text class="text label" x="710" y="650" text-anchor="middle">sinh phụ đề</text>

  <!-- CongViecVideo to LichSuXuLy -->
  <path class="rel" d="M980 535 V620 H1245 V710"/>
  <text class="text multi" x="998" y="565">1</text>
  <text class="text multi" x="1262" y="692">N</text>
  <text class="text label" x="1120" y="650" text-anchor="middle">ghi lịch sử</text>

  <!-- NguoiDung to LichSuXuLy -->
  <path class="rel" d="M300 500 V610 H1170 V710"/>
  <text class="text multi" x="318" y="530">1</text>
  <text class="text multi" x="1188" y="692">N</text>
  <text class="text label" x="730" y="640" text-anchor="middle">thực hiện thao tác</text>

  <!-- TepPhuongTien to PhuDe -->
  <path class="rel" d="M1520 500 V610 H675 V710"/>
  <text class="text multi" x="1538" y="530">1</text>
  <text class="text multi" x="692" y="692">N</text>
  <text class="text label" x="1085" y="595" text-anchor="middle">làm dữ liệu đầu vào</text>

  <!-- NguoiDung to TepPhuongTien -->
  <path class="dash" d="M480 235 C690 70 1125 80 1325 235"/>
  <text class="text multi" x="510" y="218">1</text>
  <text class="text multi" x="1288" y="218">N</text>
  <text class="text label" x="900" y="105" text-anchor="middle">sở hữu tệp tải lên</text>

  <!-- legend -->
  <g transform="translate(80 1005)">
    <rect class="box" width="270" height="85"/>
    <text class="text key" x="24" y="34">PK: Khóa chính</text>
    <text class="text key" x="24" y="66">FK: Khóa ngoại</text>
  </g>

  <text class="text note" x="900" y="1090" text-anchor="middle">
    Bội số 1 - N thể hiện một bản ghi ở thực thể nguồn có thể liên kết với nhiều bản ghi ở thực thể đích.
  </text>
</svg>
