<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs><style>.paper{fill:#fff}.line{stroke:#111;stroke-width:1.7;fill:none}.dash{stroke:#111;stroke-width:1.4;stroke-dasharray:7 6;fill:none}.box{fill:#fff;stroke:#111;stroke-width:1.8}.act{fill:#f9fafb;stroke:#111;stroke-width:1.5}.text{font-family:"Times New Roman",serif;fill:#111}.title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.msg{font-size:15px}.arrow{marker-end:url(#m)}.return{marker-end:url(#m);stroke-dasharray:7 6}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs>
  <rect class="paper" width="1700" height="980"/><text class="text title" x="850" y="55" text-anchor="middle">Biểu đồ trình tự: Upload video/audio</text>
  <rect class="box" x="70" y="100" width="170" height="52"/><text class="text label" x="155" y="132" text-anchor="middle">Người dùng</text>
  <rect class="box" x="340" y="100" width="190" height="52"/><text class="text label" x="435" y="132" text-anchor="middle">Frontend</text>
  <rect class="box" x="620" y="100" width="190" height="52"/><text class="text label" x="715" y="132" text-anchor="middle">Backend API</text>
  <rect class="box" x="900" y="100" width="190" height="52"/><text class="text label" x="995" y="132" text-anchor="middle">File Storage</text>
  <rect class="box" x="1180" y="100" width="190" height="52"/><text class="text label" x="1275" y="132" text-anchor="middle">Database</text>
  <rect class="box" x="1460" y="100" width="170" height="52"/><text class="text label" x="1545" y="132" text-anchor="middle">Queue</text>
  <path class="dash" d="M155 152 V900"/><path class="dash" d="M435 152 V900"/><path class="dash" d="M715 152 V900"/><path class="dash" d="M995 152 V900"/><path class="dash" d="M1275 152 V900"/><path class="dash" d="M1545 152 V900"/>
  <rect class="act" x="427" y="220" width="16" height="560"/><rect class="act" x="707" y="310" width="16" height="420"/><rect class="act" x="987" y="390" width="16" height="90"/><rect class="act" x="1267" y="520" width="16" height="130"/><rect class="act" x="1537" y="670" width="16" height="60"/>
  <path class="line arrow" d="M155 225 H427"/><text class="text msg" x="290" y="215" text-anchor="middle">Chọn file và ngôn ngữ nguồn</text>
  <path class="line arrow" d="M155 275 H427"/><text class="text msg" x="290" y="265" text-anchor="middle">Nhấn upload</text>
  <path class="line arrow" d="M443 325 H707"/><text class="text msg" x="575" y="315" text-anchor="middle">POST /api/upload hoặc /api/upload-audio</text>
  <path class="line arrow" d="M723 405 H987"/><text class="text msg" x="855" y="395" text-anchor="middle">Lưu file vào uploads</text>
  <path class="line return" d="M987 465 H723"/><text class="text msg" x="855" y="455" text-anchor="middle">Trả đường dẫn file</text>
  <path class="line arrow" d="M723 540 H1267"/><text class="text msg" x="995" y="530" text-anchor="middle">Tạo user, video_jobs, media_files</text>
  <path class="line arrow" d="M723 600 H1267"/><text class="text msg" x="995" y="590" text-anchor="middle">Ghi processing_history upload</text>
  <path class="line return" d="M1267 650 H723"/><text class="text msg" x="995" y="640" text-anchor="middle">Commit thành công</text>
  <path class="line arrow" d="M723 695 H1537"/><text class="text msg" x="1130" y="685" text-anchor="middle">Thêm background task xử lý phụ đề</text>
  <path class="line return" d="M707 755 H443"/><text class="text msg" x="575" y="745" text-anchor="middle">Trả job_id, status=queued</text>
  <path class="line return" d="M427 815 H155"/><text class="text msg" x="290" y="805" text-anchor="middle">Hiển thị job trong hàng đợi</text>
</svg>
