<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs><style>.bg{fill:#f6f8fb}.node{fill:#fff;stroke:#d7deea;stroke-width:2}.ai{fill:#ecfeff;stroke:#0891b2}.out{fill:#f0fdf4;stroke:#16a34a}.text{font-family:Arial,sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:15px;fill:#475569}.arrow{stroke:#0891b2;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0891b2"/></marker></defs>
  <rect class="bg" width="1400" height="760" rx="28"/><text class="text title" x="700" y="60" text-anchor="middle">Pipeline AI tạo phụ đề tiếng Việt</text>
  <g transform="translate(90 170)">
    <rect class="node" x="0" y="0" width="190" height="100" rx="18"/><text class="text label" x="95" y="42" text-anchor="middle">Video/Audio</text><text class="small" x="95" y="72" text-anchor="middle">mp4, mp3, wav</text>
    <path class="arrow" d="M200 50 H270"/>
    <rect class="node ai" x="280" y="0" width="190" height="100" rx="18"/><text class="text label" x="375" y="42" text-anchor="middle">FFmpeg</text><text class="small" x="375" y="72" text-anchor="middle">Tách audio WAV</text>
    <path class="arrow" d="M480 50 H550"/>
    <rect class="node ai" x="560" y="0" width="190" height="100" rx="18"/><text class="text label" x="655" y="42" text-anchor="middle">Whisper</text><text class="small" x="655" y="72" text-anchor="middle">Speech → Text</text>
    <path class="arrow" d="M760 50 H830"/>
    <rect class="node ai" x="840" y="0" width="190" height="100" rx="18"/><text class="text label" x="935" y="42" text-anchor="middle">NLLB</text><text class="small" x="935" y="72" text-anchor="middle">Dịch tiếng Việt</text>
    <path class="arrow" d="M1040 50 H1110"/>
    <rect class="node ai" x="1120" y="0" width="190" height="100" rx="18"/><text class="text label" x="1215" y="42" text-anchor="middle">Gemini</text><text class="small" x="1215" y="72" text-anchor="middle">Tinh chỉnh câu</text>
  </g>
  <path class="arrow" d="M1305 270 C1305 360 1150 360 1150 440"/>
  <g transform="translate(250 440)">
    <rect class="node out" x="720" y="0" width="230" height="110" rx="18"/><text class="text label" x="835" y="45" text-anchor="middle">JSON + SRT</text><text class="small" x="835" y="75" text-anchor="middle">Lưu uploads/subtitle</text>
    <path class="arrow" d="M710 55 H595"/>
    <rect class="node out" x="355" y="0" width="230" height="110" rx="18"/><text class="text label" x="470" y="45" text-anchor="middle">Editor</text><text class="small" x="470" y="75" text-anchor="middle">Người dùng chỉnh sửa</text>
    <path class="arrow" d="M345 55 H230"/>
    <rect class="node out" x="0" y="0" width="220" height="110" rx="18"/><text class="text label" x="110" y="45" text-anchor="middle">Download</text><text class="small" x="110" y="75" text-anchor="middle">SRT / MP4 hardsub</text>
  </g>
</svg>
