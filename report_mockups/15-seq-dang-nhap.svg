<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>.paper{fill:#fff}.line{stroke:#111;stroke-width:1.7;fill:none}.dash{stroke:#111;stroke-width:1.4;stroke-dasharray:7 6;fill:none}.box{fill:#fff;stroke:#111;stroke-width:1.8}.act{fill:#f9fafb;stroke:#111;stroke-width:1.5}.text{font-family:"Times New Roman",serif;fill:#111}.title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.msg{font-size:15px}.arrow{marker-end:url(#m)}.return{marker-end:url(#m);stroke-dasharray:7 6}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs>
  <rect class="paper" width="1600" height="900"/><text class="text title" x="800" y="55" text-anchor="middle">Biểu đồ trình tự: Đăng nhập hệ thống</text>
  <rect class="box" x="80" y="100" width="170" height="52"/><text class="text label" x="165" y="132" text-anchor="middle">Người dùng</text>
  <rect class="box" x="360" y="100" width="170" height="52"/><text class="text label" x="445" y="132" text-anchor="middle">Frontend</text>
  <rect class="box" x="640" y="100" width="190" height="52"/><text class="text label" x="735" y="132" text-anchor="middle">Firebase Auth</text>
  <rect class="box" x="940" y="100" width="190" height="52"/><text class="text label" x="1035" y="132" text-anchor="middle">Firestore</text>
  <rect class="box" x="1240" y="100" width="190" height="52"/><text class="text label" x="1335" y="132" text-anchor="middle">Trang đích</text>
  <path class="dash" d="M165 152 V830"/><path class="dash" d="M445 152 V830"/><path class="dash" d="M735 152 V830"/><path class="dash" d="M1035 152 V830"/><path class="dash" d="M1335 152 V830"/>
  <rect class="act" x="437" y="220" width="16" height="475"/><rect class="act" x="727" y="315" width="16" height="160"/><rect class="act" x="1027" y="520" width="16" height="95"/>
  <path class="line arrow" d="M165 225 H437"/><text class="text msg" x="300" y="215" text-anchor="middle">Nhập email/mật khẩu hoặc chọn Google</text>
  <path class="line arrow" d="M165 275 H437"/><text class="text msg" x="300" y="265" text-anchor="middle">Nhấn đăng nhập</text>
  <path class="line arrow" d="M453 330 H727"/><text class="text msg" x="590" y="320" text-anchor="middle">signInWithEmailAndPassword / Google</text>
  <path class="line return" d="M727 395 H453"/><text class="text msg" x="590" y="385" text-anchor="middle">Trả user + Firebase token</text>
  <path class="line arrow" d="M453 535 H1027"/><text class="text msg" x="740" y="525" text-anchor="middle">Đọc hồ sơ người dùng và role</text>
  <path class="line return" d="M1027 600 H453"/><text class="text msg" x="740" y="590" text-anchor="middle">Trả role user/admin</text>
  <path class="line arrow" d="M453 660 H1327"/><text class="text msg" x="890" y="650" text-anchor="middle">Điều hướng /app hoặc /admin</text>
  <path class="line return" d="M1327 720 H165"/><text class="text msg" x="745" y="710" text-anchor="middle">Hiển thị giao diện sau đăng nhập</text>
</svg>
