<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
  <defs>
    <style>
      .paper{fill:#fff}
      .frame{fill:none;stroke:#111;stroke-width:2}
      .box{fill:#fff;stroke:#111;stroke-width:2}
      .subbox{fill:#fff;stroke:#111;stroke-width:1.4}
      .line{stroke:#111;stroke-width:1.8;fill:none}
      .dash{stroke:#111;stroke-width:1.5;stroke-dasharray:8 7;fill:none}
      .text{font-family:"Times New Roman",serif;fill:#111}
      .title{font-size:24px;font-weight:700}
      .layer{font-size:18px;font-weight:700}
      .label{font-size:18px;font-weight:700}
      .small{font-size:15px}
      .note{font-size:14px;font-style:italic}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
  </defs>

  <rect class="paper" width="1700" height="1050"/>
  <text class="text title" x="850" y="48" text-anchor="middle">SƠ ĐỒ KIẾN TRÚC HỆ THỐNG WEB SAAS TẠO PHỤ ĐỀ TIẾNG VIỆT TỰ ĐỘNG</text>

  <!-- System boundary -->
  <rect class="frame" x="60" y="80" width="1580" height="900"/>

  <!-- Client layer -->
  <rect class="box" x="105" y="135" width="360" height="230"/>
  <text class="text layer" x="285" y="170" text-anchor="middle">Lớp người dùng</text>
  <line class="line" x1="105" y1="190" x2="465" y2="190"/>
  <rect class="subbox" x="145" y="220" width="280" height="54"/>
  <text class="text label" x="285" y="253" text-anchor="middle">Trình duyệt Web</text>
  <rect class="subbox" x="145" y="292" width="280" height="54"/>
  <text class="text small" x="285" y="315" text-anchor="middle">Người dùng / Admin</text>
  <text class="text small" x="285" y="337" text-anchor="middle">Upload, chỉnh sửa, tải phụ đề</text>

  <!-- Presentation layer -->
  <rect class="box" x="595" y="115" width="510" height="270"/>
  <text class="text layer" x="850" y="150" text-anchor="middle">Lớp giao diện</text>
  <line class="line" x1="595" y1="170" x2="1105" y2="170"/>
  <rect class="subbox" x="635" y="205" width="205" height="70"/>
  <text class="text label" x="737" y="234" text-anchor="middle">Next.js</text>
  <text class="text small" x="737" y="256" text-anchor="middle">React Client</text>
  <rect class="subbox" x="860" y="205" width="205" height="70"/>
  <text class="text label" x="962" y="234" text-anchor="middle">Trang xử lý</text>
  <text class="text small" x="962" y="256" text-anchor="middle">Video, phụ đề, lịch sử</text>
  <rect class="subbox" x="635" y="295" width="430" height="58"/>
  <text class="text small" x="850" y="320" text-anchor="middle">Gửi yêu cầu HTTP/REST và nhận trạng thái xử lý theo job</text>
  <text class="text small" x="850" y="342" text-anchor="middle">Hiển thị kết quả SRT, video có phụ đề và kho lưu trữ</text>

  <!-- Backend layer -->
  <rect class="box" x="595" y="470" width="510" height="310"/>
  <text class="text layer" x="850" y="505" text-anchor="middle">Lớp nghiệp vụ và API</text>
  <line class="line" x1="595" y1="525" x2="1105" y2="525"/>
  <rect class="subbox" x="630" y="555" width="205" height="72"/>
  <text class="text label" x="732" y="584" text-anchor="middle">FastAPI</text>
  <text class="text small" x="732" y="607" text-anchor="middle">Upload, status, download</text>
  <rect class="subbox" x="865" y="555" width="205" height="72"/>
  <text class="text label" x="967" y="584" text-anchor="middle">Xử lý nền</text>
  <text class="text small" x="967" y="607" text-anchor="middle">Tạo job và cập nhật tiến trình</text>
  <rect class="subbox" x="630" y="655" width="205" height="72"/>
  <text class="text label" x="732" y="684" text-anchor="middle">Xác thực</text>
  <text class="text small" x="732" y="707" text-anchor="middle">Người dùng, phân quyền</text>
  <rect class="subbox" x="865" y="655" width="205" height="72"/>
  <text class="text label" x="967" y="684" text-anchor="middle">Quản trị</text>
  <text class="text small" x="967" y="707" text-anchor="middle">Job, logs, thống kê</text>
  <text class="text note" x="850" y="755" text-anchor="middle">Backend điều phối dữ liệu, file và pipeline AI xử lý phụ đề</text>

  <!-- AI layer -->
  <rect class="box" x="1245" y="135" width="340" height="300"/>
  <text class="text layer" x="1415" y="170" text-anchor="middle">Lớp xử lý AI</text>
  <line class="line" x1="1245" y1="190" x2="1585" y2="190"/>
  <rect class="subbox" x="1282" y="220" width="265" height="48"/>
  <text class="text small" x="1415" y="250" text-anchor="middle">FFmpeg tách âm thanh / ghép phụ đề</text>
  <rect class="subbox" x="1282" y="285" width="265" height="48"/>
  <text class="text small" x="1415" y="315" text-anchor="middle">Whisper nhận dạng lời nói</text>
  <rect class="subbox" x="1282" y="350" width="265" height="48"/>
  <text class="text small" x="1415" y="380" text-anchor="middle">NLLB / Gemini dịch và hiệu chỉnh</text>

  <!-- Data layer -->
  <rect class="box" x="1245" y="535" width="340" height="300"/>
  <text class="text layer" x="1415" y="570" text-anchor="middle">Lớp dữ liệu</text>
  <line class="line" x1="1245" y1="590" x2="1585" y2="590"/>
  <rect class="subbox" x="1282" y="620" width="265" height="62"/>
  <text class="text label" x="1415" y="647" text-anchor="middle">MySQL</text>
  <text class="text small" x="1415" y="669" text-anchor="middle">users, video_jobs, subtitles</text>
  <rect class="subbox" x="1282" y="705" width="265" height="62"/>
  <text class="text label" x="1415" y="732" text-anchor="middle">Kho lưu trữ file</text>
  <text class="text small" x="1415" y="754" text-anchor="middle">video, audio, SRT, JSON</text>
  <text class="text note" x="1415" y="805" text-anchor="middle">Lưu metadata trong CSDL và file kết quả trên server</text>

  <!-- External authentication -->
  <rect class="box" x="105" y="565" width="360" height="185"/>
  <text class="text layer" x="285" y="600" text-anchor="middle">Dịch vụ hỗ trợ</text>
  <line class="line" x1="105" y1="620" x2="465" y2="620"/>
  <rect class="subbox" x="145" y="650" width="280" height="58"/>
  <text class="text label" x="285" y="676" text-anchor="middle">Firebase</text>
  <text class="text small" x="285" y="698" text-anchor="middle">Xác thực và vai trò người dùng</text>

  <!-- Arrows -->
  <path class="line" marker-end="url(#arrow)" d="M465 250 H595"/>
  <text class="text small" x="530" y="235" text-anchor="middle">HTTP/HTTPS</text>

  <path class="line" marker-end="url(#arrow)" d="M850 385 V470"/>
  <text class="text small" x="890" y="430">REST API</text>

  <path class="line" marker-end="url(#arrow)" d="M1105 600 H1245"/>
  <text class="text small" x="1175" y="585" text-anchor="middle">xử lý job</text>

  <path class="line" marker-end="url(#arrow)" d="M1105 695 H1245"/>
  <text class="text small" x="1175" y="680" text-anchor="middle">đọc/ghi dữ liệu</text>

  <path class="line" marker-end="url(#arrow)" d="M1415 435 V535"/>
  <text class="text small" x="1460" y="490">kết quả</text>

  <path class="dash" marker-end="url(#arrow)" d="M465 675 H595"/>
  <text class="text small" x="530" y="660" text-anchor="middle">token</text>

  <path class="dash" marker-end="url(#arrow)" d="M595 690 H465"/>
  <text class="text small" x="530" y="725" text-anchor="middle">xác minh</text>

  <!-- Flow labels at bottom -->
  <rect class="box" x="235" y="880" width="1230" height="55"/>
  <text class="text small" x="850" y="914" text-anchor="middle">
    Luồng chính: người dùng tải video/audio lên → backend tạo job → pipeline AI sinh phụ đề → lưu kết quả → giao diện hiển thị và cho phép tải SRT/video.
  </text>
</svg>
