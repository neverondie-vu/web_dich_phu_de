  <rect class="box" x="760" y="100" width="190" height="52"/><text class="text label" x="855" y="132" text-anchor="middle">Backend API</text>
  <rect class="box" x="1090" y="100" width="190" height="52"/><text class="text label" x="1185" y="132" text-anchor="middle">Database</text>
  <path class="dash" d="M185 152 V700"/><path class="dash" d="M520 152 V700"/><path class="dash" d="M855 152 V700"/><path class="dash" d="M1185 152 V700"/>
  <rect class="act" x="512" y="230" width="16" height="300"/><rect class="act" x="847" y="300" width="16" height="230"/><rect class="act" x="1177" y="370" width="16" height="100"/>
  <path class="line arrow" d="M185 235 H512"/><text class="text msg" x="349" y="225" text-anchor="middle">Mở panel lịch sử</text>
