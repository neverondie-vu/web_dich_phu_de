<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1250" viewBox="0 0 1300 1250">
  <defs><style>.paper{fill:#fff}.node{fill:#fff;stroke:#111;stroke-width:2}.line{stroke:#111;stroke-width:1.8;fill:none;marker-end:url(#m)}.text{font-family:"Times New Roman",serif;fill:#111}.title{font-size:24px;font-weight:700}.label{font-size:19px}.small{font-size:16px}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs>
  <rect class="paper" width="1300" height="1250"/><text class="text title" x="650" y="55" text-anchor="middle">Biểu đồ hoạt động: Upload video/audio</text>
  <circle class="node" cx="650" cy="105" r="18"/><circle fill="#111" cx="650" cy="105" r="9"/><path class="line" d="M650 123 V165"/>
  <rect class="node" x="455" y="165" width="390" height="62" rx="16"/><text class="text label" x="650" y="203" text-anchor="middle">Chọn loại file và ngôn ngữ nguồn</text><path class="line" d="M650 227 V275"/>
  <rect class="node" x="500" y="275" width="300" height="62" rx="16"/><text class="text label" x="650" y="313" text-anchor="middle">Chọn file cần xử lý</text><path class="line" d="M650 337 V390"/>
  <path class="node" d="M650 390 L790 475 L650 560 L510 475 Z"/><text class="text label" x="650" y="482" text-anchor="middle">File hợp lệ?</text>
  <path class="line" d="M510 475 H285 V705"/><text class="text small" x="400" y="455">Không</text><rect class="node" x="125" y="705" width="320" height="62" rx="16"/><text class="text label" x="285" y="743" text-anchor="middle">Thông báo file không hợp lệ</text><path class="line" d="M285 767 V1140 H632"/>
  <path class="line" d="M650 560 V620"/><text class="text small" x="675" y="595">Có</text><rect class="node" x="500" y="620" width="300" height="62" rx="16"/><text class="text label" x="650" y="658" text-anchor="middle">Gửi file tới backend</text><path class="line" d="M650 682 V740"/>
  <rect class="node" x="465" y="740" width="370" height="62" rx="16"/><text class="text label" x="650" y="778" text-anchor="middle">Lưu file vào thư mục uploads</text><path class="line" d="M650 802 V860"/>
  <rect class="node" x="455" y="860" width="390" height="62" rx="16"/><text class="text label" x="650" y="898" text-anchor="middle">Tạo job và ghi dữ liệu vào MySQL</text><path class="line" d="M650 922 V980"/>
  <rect class="node" x="455" y="980" width="390" height="62" rx="16"/><text class="text label" x="650" y="1018" text-anchor="middle">Thêm tác vụ xử lý phụ đề nền</text><path class="line" d="M650 1042 V1100"/>
  <rect class="node" x="475" y="1100" width="350" height="62" rx="16"/><text class="text label" x="650" y="1138" text-anchor="middle">Hiển thị job trong hàng đợi</text><path class="line" d="M650 1162 V1200"/>
  <circle class="node" cx="650" cy="1200" r="22"/><circle fill="#111" cx="650" cy="1200" r="13"/>
</svg>
