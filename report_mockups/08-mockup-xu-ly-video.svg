  <rect class="card" x="555" y="230" width="350" height="110" rx="16"/><text class="text label" x="580" y="270">job_9684f3d0</text><text class="muted small" x="580" y="305">Đang nhận diện giọng nói...</text>
  <rect class="card" x="555" y="370" width="350" height="110" rx="16"/><text class="text label" x="580" y="410">job_a87f50db</text><text class="muted small" x="580" y="445">Đã tạo SRT</text>
