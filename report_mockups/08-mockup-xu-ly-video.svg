<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs><style>.bg{fill:#08111f}.panel{fill:#101d31;stroke:#263b58;stroke-width:2}.card{fill:#14233a;stroke:#2b4568;stroke-width:2}.cyan{fill:#22d3ee}.text{font-family:Arial,sans-serif;fill:#f8fafc}.muted{fill:#94a3b8}.title{font-size:32px;font-weight:800}.label{font-size:18px;font-weight:700}.small{font-size:14px}</style></defs>
  <rect class="bg" width="1500" height="900" rx="28"/>
