  <rect class="card" x="1015" y="345" width="380" height="90" rx="16"/><text class="muted small" x="1040" y="380">00:00:05,000 → 00:00:08,000</text><text class="text label" x="1040" y="410">Đây là bản phụ đề tự động.</text>
