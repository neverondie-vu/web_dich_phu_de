    <rect class="card" x="600" width="260" height="130" rx="18"/><text class="muted small" x="630" y="45">Đang xử lý</text><text class="text title" x="630" y="92">12</text>
    <rect class="card" x="900" width="260" height="130" rx="18"/><text class="muted small" x="930" y="45">Lỗi</text><text class="text title" x="930" y="92">3</text>
  </g>
  <rect class="panel" x="340" y="330" width="700" height="420" rx="22"/><text class="text label" x="380" y="385">Danh sách job</text>
