<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs><style>.bg{fill:#07111f}.side{fill:#0d1728}.panel{fill:#101d31;stroke:#263b58;stroke-width:2}.card{fill:#14233a;stroke:#2b4568;stroke-width:2}.accent{fill:#22d3ee}.text{font-family:Arial,sans-serif;fill:#f8fafc}.muted{fill:#94a3b8}.title{font-size:32px;font-weight:800}.label{font-size:18px;font-weight:700}.small{font-size:14px}</style></defs>
  <rect class="bg" width="1500" height="900" rx="28"/><rect class="side" x="0" y="0" width="280" height="900"/>
  <text class="text label" x="40" y="70">Admin Console</text><text class="muted small" x="40" y="120">Tổng quan</text><text class="muted small" x="40" y="170">Người dùng</text><text class="muted small" x="40" y="220">Jobs xử lý</text><text class="muted small" x="40" y="270">Cấu hình</text><text class="muted small" x="40" y="320">Bảo mật</text>
  <text class="text title" x="340" y="70">Quản trị hệ thống</text><text class="muted small" x="340" y="100">Theo dõi thống kê, job xử lý, cấu hình AI và bảo trì</text>
