  <defs><style>.bg{fill:#f3f6fb}.left{fill:#0f172a}.card{fill:#fff;stroke:#d7deea;stroke-width:2}.input{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.btn{fill:#2563eb}.text{font-family:Arial,sans-serif;fill:#0f172a}.white{fill:#fff}.muted{fill:#64748b}.title{font-size:38px;font-weight:800}.label{font-size:19px;font-weight:700}.small{font-size:15px}</style></defs>
