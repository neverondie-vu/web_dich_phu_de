<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200">
  <defs>
    <style>
      .paper{fill:#fff}.line{stroke:#111;stroke-width:1.8;fill:none;marker-end:url(#m)}.node{fill:#fff;stroke:#111;stroke-width:2}.decision{fill:#fff;stroke:#111;stroke-width:2}.bar{fill:#111}.text{font-family:"Times New Roman",serif;fill:#111}.title{font-size:22px;font-weight:700}.label{font-size:18px}.small{font-size:15px}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#111" stroke-width="1.4"/></marker>
  </defs>
  <rect class="paper" width="1400" height="1200"/>
  <text class="text title" x="700" y="55" text-anchor="middle">Biểu đồ hoạt động: Quy trình tạo phụ đề tự động</text>

  <circle class="node" cx="700" cy="105" r="18"/><circle fill="#111" cx="700" cy="105" r="9"/>
  <path class="line" d="M700 123 V155"/>
  <rect class="node" x="520" y="155" width="360" height="58" rx="16"/><text class="text label" x="700" y="191" text-anchor="middle">Người dùng đăng nhập hệ thống</text>
  <path class="line" d="M700 213 V250"/>
  <rect class="node" x="500" y="250" width="400" height="58" rx="16"/><text class="text label" x="700" y="286" text-anchor="middle">Chọn video/audio và ngôn ngữ nguồn</text>
  <path class="line" d="M700 308 V345"/>
  <rect class="node" x="560" y="345" width="280" height="58" rx="16"/><text class="text label" x="700" y="381" text-anchor="middle">Upload file</text>
  <path class="line" d="M700 403 V455"/>
  <path class="decision" d="M700 455 L810 525 L700 595 L590 525 Z"/><text class="text label" x="700" y="532" text-anchor="middle">File hợp lệ?</text>
  <path class="line" d="M590 525 H370 V645"/><text class="text small" x="470" y="510">Không</text>
  <rect class="node" x="210" y="645" width="320" height="58" rx="16"/><text class="text label" x="370" y="681" text-anchor="middle">Thông báo lỗi upload</text>
  <path class="line" d="M370 703 V1085"/>
  <path class="line" d="M700 595 V645"/><text class="text small" x="720" y="625">Có</text>
  <rect class="node" x="510" y="645" width="380" height="58" rx="16"/><text class="text label" x="700" y="681" text-anchor="middle">Tạo job, lưu file và ghi database</text>
  <path class="line" d="M700 703 V750"/>
  <rect class="node" x="520" y="750" width="360" height="58" rx="16"/><text class="text label" x="700" y="786" text-anchor="middle">FFmpeg tách âm thanh</text>
  <path class="line" d="M700 808 V855"/>
  <rect class="node" x="520" y="855" width="360" height="58" rx="16"/><text class="text label" x="700" y="891" text-anchor="middle">Whisper nhận diện giọng nói</text>
  <path class="line" d="M700 913 V960"/>
  <rect class="node" x="520" y="960" width="360" height="58" rx="16"/><text class="text label" x="700" y="996" text-anchor="middle">NLLB dịch sang tiếng Việt</text>
  <path class="line" d="M700 1018 V1065"/>
  <rect class="node" x="510" y="1065" width="380" height="58" rx="16"/><text class="text label" x="700" y="1101" text-anchor="middle">Gemini tinh chỉnh và tạo JSON/SRT</text>
  <path class="line" d="M890 1094 H1060 V760"/>
  <path class="decision" d="M1060 655 L1165 725 L1060 795 L955 725 Z"/><text class="text label" x="1060" y="732" text-anchor="middle">Xử lý lỗi?</text>
  <path class="line" d="M1060 795 V1085"/><text class="text small" x="1080" y="835">Không</text>
  <rect class="node" x="930" y="1085" width="260" height="58" rx="16"/><text class="text label" x="1060" y="1121" text-anchor="middle">Hiển thị phụ đề</text>
  <path class="line" d="M955 725 H880"/><text class="text small" x="905" y="710">Có</text>
  <rect class="node" x="1015" y="555" width="300" height="58" rx="16"/><text class="text label" x="1165" y="591" text-anchor="middle">Cập nhật trạng thái failed</text>
  <path class="line" d="M1165 613 V1085"/>
  <circle class="node" cx="700" cy="1160" r="22"/><circle fill="#111" cx="700" cy="1160" r="14"/>
  <path class="line" d="M1060 1143 C1000 1170 820 1170 722 1160"/>
  <path class="line" d="M370 1085 C430 1160 560 1160 678 1160"/>
</svg>
