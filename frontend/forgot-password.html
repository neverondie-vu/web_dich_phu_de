<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Khôi phục mật khẩu - AutoSub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --cyan: #06b6d4;
        --blue: #3b82f6;
        --bg: #080c14;
        --surface: rgba(255, 255, 255, 0.04);
        --surface-hover: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.09);
        --border-focus: rgba(6, 182, 212, 0.55);
        --text-primary: #eef4ff;
        --text-secondary: rgba(190, 215, 255, 0.5);
        --success: #22c55e;
        --error: #f87171;
      }
      html,
      body {
        height: 100%;
        font-family: "Be Vietnam Pro", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        overflow: hidden;
      }
      #bg-canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .page {
        position: relative;
        z-index: 1;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(10, 16, 28, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 24px;
        padding: 44px 40px 36px;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow:
          0 0 0 1px rgba(6, 182, 212, 0.06),
          0 24px 60px rgba(0, 0, 0, 0.5),
          0 0 80px rgba(6, 182, 212, 0.04);
        animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 36px;
        animation: rise 0.6s 0.05s both;
      }
      .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: linear-gradient(135deg, var(--cyan), var(--blue));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 22px rgba(6, 182, 212, 0.4);
        flex-shrink: 0;
      }
      .brand-icon svg {
        width: 20px;
        height: 20px;
      }
      .brand-name {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.3px;
        background: linear-gradient(90deg, #fff 30%, rgba(6, 182, 212, 0.85));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .heading-block {
        margin-bottom: 28px;
        animation: rise 0.6s 0.1s both;
      }
      .heading-block h2 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1.2;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #fff 40%, rgba(6, 182, 212, 0.75));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .heading-block p {
        font-size: 13.5px;
        color: var(--text-secondary);
        line-height: 1.65;
      }
      .success-msg {
        display: none;
        background: rgba(34, 197, 94, 0.07);
        border: 1px solid rgba(34, 197, 94, 0.22);
        border-radius: 16px;
        padding: 28px 20px;
        text-align: center;
        animation: fadeScale 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes fadeScale {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .check-ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(34, 197, 94, 0.1);
        border: 1.5px solid rgba(34, 197, 94, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
      }
      .check-ring svg {
        width: 26px;
        height: 26px;
        stroke: var(--success);
      }
      .success-msg p {
        font-size: 14px;
        font-weight: 600;
        color: rgba(134, 239, 172, 0.9);
      }
      .success-msg span {
        display: block;
        margin-top: 5px;
        font-size: 12.5px;
        color: rgba(134, 239, 172, 0.45);
        line-height: 1.5;
      }
      #forgotForm {
        animation: rise 0.6s 0.13s both;
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.9px;
        margin-bottom: 8px;
      }
      .input-wrap {
        position: relative;
      }
      .input-wrap .ico {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 17px;
        height: 17px;
        color: var(--text-secondary);
        pointer-events: none;
        transition: color 0.2s;
      }
      .input-wrap:focus-within .ico {
        color: var(--cyan);
      }
      .input-wrap input {
        width: 100%;
        padding: 13px 14px 13px 43px;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.25s,
          background 0.25s,
          box-shadow 0.25s;
      }
      .input-wrap input::placeholder {
        color: rgba(190, 215, 255, 0.2);
      }
      .input-wrap input:hover {
        background: var(--surface-hover);
        border-color: rgba(255, 255, 255, 0.14);
      }
      .input-wrap input:focus {
        background: rgba(6, 182, 212, 0.05);
        border-color: var(--border-focus);
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.09);
      }
      .err-hint {
        display: none;
        font-size: 12px;
        color: var(--error);
        margin-top: 6px;
        padding-left: 2px;
      }
      .btn-reset {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        color: #fff;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        cursor: pointer;
        margin-top: 6px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 100%);
        box-shadow: 0 4px 22px rgba(6, 182, 212, 0.28);
        transition:
          transform 0.2s,
          box-shadow 0.3s,
          opacity 0.2s;
      }
      .btn-reset::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.18),
          transparent
        );
        opacity: 0;
        transition: opacity 0.3s;
      }
      .btn-reset:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(6, 182, 212, 0.42);
      }
      .btn-reset:hover:not(:disabled)::before {
        opacity: 1;
      }
      .btn-reset:active:not(:disabled) {
        transform: translateY(0);
      }
      .btn-reset:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }
      .btn-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .spinner {
        display: none;
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .divider {
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          var(--border),
          transparent
        );
        margin: 24px 0;
      }
      .footer {
        text-align: center;
        font-size: 13px;
        color: var(--text-secondary);
        animation: rise 0.6s 0.18s both;
      }
      .footer a {
        color: var(--cyan);
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: opacity 0.2s;
      }
      .footer a:hover {
        opacity: 0.7;
      }
      .footer a svg {
        width: 13px;
        height: 13px;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-5px);
        }
        40%,
        80% {
          transform: translateX(5px);
        }
      }
      .shake {
        animation: shake 0.38s ease;
      }
    </style>
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>
    <div class="page">
      <div class="card">
        <div class="brand">
          <div class="brand-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 2L2 7l10 5 10-5-10-5z" />
              <path d="M2 17l10 5 10-5" />
              <path d="M2 12l10 5 10-5" />
            </svg>
          </div>
          <span class="brand-name">AutoSub</span>
        </div>
        <div class="heading-block">
          <h2>Quên mật khẩu?</h2>
          <p>
            Nhập email đã đăng ký — chúng tôi sẽ gửi liên kết đặt lại ngay cho
            bạn.
          </p>
        </div>
        <div id="statusMsg" class="success-msg">
          <div class="check-ring">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <p>Liên kết đã được gửi!</p>
          <span>Vui lòng kiểm tra hộp thư của bạn và làm theo hướng dẫn.</span>
        </div>
        <form id="forgotForm" novalidate>
          <div class="field">
            <label for="emailReset">Email tài khoản</label>
            <div class="input-wrap">
              <svg
                class="ico"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m2 7 10 7 10-7" />
              </svg>
              <input
                type="email"
                id="emailReset"
                placeholder="email@example.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="err-hint" id="errHint"></div>
          </div>
          <button type="submit" class="btn-reset">
            <span class="btn-inner">
              <span class="spinner" id="spinner"></span>
              <span id="btnText">Gửi yêu cầu khôi phục</span>
            </span>
          </button>
        </form>
        <div class="divider"></div>
        <div class="footer">
          <a href="login.html">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 5l-7 7 7 7" />
            </svg>
            Quay lại đăng nhập
          </a>
        </div>
      </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
    <script>
      (function () {
        const canvas = document.getElementById("bg-canvas");
        const ctx = canvas.getContext("2d");
        let W, H;
        const particles = [];
        const stars = [];
        function resize() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
        }
        function rp(full) {
          return {
            x: Math.random() * W,
            y: full ? Math.random() * H : H + 6,
            r: Math.random() * 1.4 + 0.2,
            vx: (Math.random() - 0.5) * 0.25,
            vy: -(Math.random() * 0.45 + 0.1),
            alpha: Math.random() * 0.5 + 0.1,
            hue: Math.random() < 0.7 ? 190 : 220,
          };
        }
        function rs() {
          return {
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.2 + 0.2,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.02 + 0.005,
            base: Math.random() * 0.3 + 0.05,
            hue: Math.random() < 0.6 ? 190 : 220,
          };
        }
        function init() {
          resize();
          for (let i = 0; i < 90; i++) particles.push(rp(true));
          for (let i = 0; i < 55; i++) stars.push(rs());
        }
        let t = 0;
        function draw() {
          ctx.clearRect(0, 0, W, H);
          t += 0.016;
          const G = 64;
          for (let x = 0; x < W; x += G) {
            ctx.strokeStyle = `rgba(6,182,212,${0.025 + 0.01 * Math.sin(t * 0.3 + x * 0.01)})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
          }
          for (let y = 0; y < H; y += G) {
            ctx.strokeStyle = `rgba(6,182,212,${0.025 + 0.01 * Math.sin(t * 0.3 + y * 0.01)})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
          }
          for (const s of stars) {
            s.phase += s.speed;
            const a = s.base + s.base * Math.sin(s.phase);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${s.hue},80%,75%,${a})`;
            ctx.fill();
          }
          for (const p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue},85%,70%,${p.alpha})`;
            ctx.fill();
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -6 || p.x < -6 || p.x > W + 6)
              Object.assign(p, rp(false));
          }
          requestAnimationFrame(draw);
        }
        window.addEventListener("resize", resize);
        init();
        draw();
      })();
    </script>
    <script>
      const forgotForm = document.getElementById("forgotForm");
      const statusMsg = document.getElementById("statusMsg");
      const spinner = document.getElementById("spinner");
      const btnText = document.getElementById("btnText");
      const btn = forgotForm.querySelector("button");
      const errHint = document.getElementById("errHint");
      const emailInput = document.getElementById("emailReset");
      function showErr(msg) {
        errHint.textContent = msg;
        errHint.style.display = "block";
        emailInput.closest(".input-wrap").classList.add("shake");
        setTimeout(
          () => emailInput.closest(".input-wrap").classList.remove("shake"),
          400,
        );
      }
      forgotForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showErr("Email không hợp lệ, vui lòng kiểm tra lại.");
          return;
        }
        errHint.style.display = "none";
        try {
          btn.disabled = true;
          spinner.style.display = "block";
          btnText.textContent = "Đang gửi…";
          await auth.sendPasswordResetEmail(email);
          forgotForm.style.display = "none";
          statusMsg.style.display = "block";
        } catch (err) {
          console.error(err);
          spinner.style.display = "none";
          btnText.textContent = "Gửi yêu cầu khôi phục";
          btn.disabled = false;
          showErr("Không tìm thấy tài khoản với email này.");
        }
      });
      emailInput.addEventListener("input", () => {
        errHint.style.display = "none";
      });
    </script>
  </body>
</html>
