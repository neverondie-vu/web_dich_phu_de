<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Đăng Ký - AutoSub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <div class="page">
      <div class="left">
        <div class="card">
          <div id="statusMsg" class="success-msg">
            <div class="check-ring">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 13l4 4L19 7" />
              </svg>
            </div>
            <p>Đăng ký thành công!</p>
            <span>Chào mừng bạn đến với AutoSub. Đang chuyển hướng...</span>
          </div>
          <span class="brand">AutoSub</span>
          <h2>Tạo tài khoản mới</h2>
          <p class="sub">Bắt đầu hành trình sáng tạo của bạn</p>

          <form id="registerForm">
            <div class="field">
              <label>Tên đăng nhập</label>
              <div class="input-wrap">
                <svg
                  class="left-ico"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <input
                  type="text"
                  name="username"
                  placeholder="Nhập username..."
                  required
                />
              </div>
            </div>

            <div class="field">
              <label>Email</label>
              <div class="input-wrap">
                <svg
                  class="left-ico"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="m2 7 10 7 10-7" />
                </svg>
                <input
                  type="email"
                  name="email"
                  placeholder="email@example.com"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label>Mật khẩu</label>
              <div class="input-wrap">
                <svg
                  class="left-ico"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input
                  type="password"
                  id="pwd"
                  name="password"
                  placeholder="••••••••"
                  oninput="checkStrength(this.value)"
                  required
                />
                <button
                  class="eye-btn"
                  type="button"
                  onclick="togglePwd()"
                  aria-label="Hiện mật khẩu"
                >
                  <svg
                    id="eye-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    width="18"
                    height="18"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
              <div class="strength-bar">
                <span id="s1"></span><span id="s2"></span><span id="s3"></span
                ><span id="s4"></span>
              </div>
            </div>

            <div class="field">
              <label>Xác nhận mật khẩu</label>
              <div class="input-wrap">
                <svg
                  class="left-ico"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input
                  type="password"
                  placeholder="Nhập lại mật khẩu..."
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn-register">Đăng Ký Ngay</button>
          </form>

          <div class="or-row">
            <hr />
            <span>hoặc</span>
            <hr />
          </div>

          <div class="socials">
            <button class="soc-btn" id="google-btn" aria-label="Google">
              <svg viewBox="0 0 24 24">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4"
                />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"
                />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  fill="#FBBC05"
                />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335"
                />
              </svg>
            </button>
          </div>

          <div class="footer">
            Đã có tài khoản? <a href="/auth/login.html">Đăng nhập</a>
          </div>
        </div>
      </div>

      <div class="right">
        <svg
          class="waveform"
          viewBox="0 0 900 120"
          xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="xMidYMid meet"
        >
          <g stroke="#1e88e5" stroke-width="1.5" fill="none" opacity=".7">
            <polyline
              points="0,60 30,45 45,75 60,30 75,80 90,50 105,65 120,40 140,70 160,55 180,35 200,68 220,50 240,72 260,42 280,60 300,38 320,65 340,45 360,72 380,55 400,35 420,60 440,50 460,30 480,68 500,45 520,70 540,40 560,60 580,48 600,72 620,52 640,38 660,65 680,50 700,30 720,68 740,52 760,72 780,42 800,60 820,38 840,65 860,48 880,60 900,55"
            />
          </g>
          <g stroke="#00cfff" stroke-width="1" fill="none" opacity=".4">
            <polyline
              points="0,65 20,50 40,78 60,40 80,70 100,55 120,68 140,42 170,72 200,50 230,38 260,65 290,52 320,70 350,45 380,65 410,55 440,30 470,65 500,48 530,68 560,42 590,60 620,50 650,72 680,40 710,60 740,48 770,72 800,45 830,60 860,50 890,65 900,55"
            />
          </g>
        </svg>

        <img class="boy-img" id="boyImg" alt="AutoSub boy" />

        <div class="tag tag-create">
          <div class="tag-icon teal">
            <div class="dot-bar">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          AI Transcribe
        </div>

        <div class="testimonial">
          <span class="quote-mark">"</span>
          <p>AutoSub giúp tôi tạo phụ đề chuyên nghiệp chỉ trong vài phút!</p>
          <div class="trust-row">
            <div class="avatars">
              <img src="https://i.pravatar.cc/40?u=b1" alt="" />
              <img src="https://i.pravatar.cc/40?u=b2" alt="" />
              <img src="https://i.pravatar.cc/40?u=b3" alt="" />
              <img src="https://i.pravatar.cc/40?u=b4" alt="" />
            </div>
            <span class="trust-text">10.000+ người dùng tin tưởng</span>
          </div>
        </div>
      </div>
    </div>

      function togglePwd() {
        const pwd = document.getElementById("pwd");
        const ico = document.getElementById("eye-icon");
        if (pwd.type === "password") {
          pwd.type = "text";
          ico.innerHTML =
            '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
          pwd.type = "password";
          ico.innerHTML =
            '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
      }

      function checkStrength(val) {
        const bars = [
          document.getElementById("s1"),
          document.getElementById("s2"),
          document.getElementById("s3"),
          document.getElementById("s4"),
        ];
        bars.forEach((b) => {
          b.className = "";
        });
        if (val.length === 0) return;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const cls = score <= 1 ? "weak" : score <= 2 ? "medium" : "strong";
        for (let i = 0; i < score; i++) bars[i].className = cls;
      }
