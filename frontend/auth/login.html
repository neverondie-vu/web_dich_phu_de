          <form id="loginForm">
            <div class="field">
              <label>Email hoặc Tên đăng nhập</label>
              <div class="input-wrap">

                  class="left-ico"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"

                  <circle cx="12" cy="7" r="4" />

                  name="email"
                  placeholder="Nhập thông tin..."
                  required
                />

            </div>

            <div class="field">
              <label>Mật khẩu</label>

                <svg
                  class="left-ico"
                  viewBox="0 0 24 24"

                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input
                  type="password"
                  name="password"
                  id="pwd"
                  placeholder="••••••••"
                  required
                />
                <button
                  class="eye-btn"
                  type="button"
                  onclick="togglePwd()"

                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-login">Đăng Nhập</button>
